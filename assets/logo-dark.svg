<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 220" width="1040" height="220" role="img" aria-label="Frieda – MCP connector for iCloud">
  <defs>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
  </defs>
  <g transform="translate(20 10) scale(0.78)">
    <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DDA067"/>
      <stop offset="1" stop-color="#A86228"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B1E5B" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#gloss)"/>

  <!-- Frieda: head in profile, looking up to the spark -->
  <g filter="url(#shadow)" transform="translate(-2 -30) scale(0.98)">
    <!-- neck -->
    <path fill="url(#fur)" d="M66 160 C68 148 80 142 96 142 L150 136 L156 200 L60 200 Z"/>
    <!-- head and muzzle as one silhouette -->
    <path fill="url(#fur)" d="M66 160 C50 126 60 90 94 76 C112 68 130 70 146 78 L188 56 C200 50 212 56 214 68 L219 92 C221 106 212 114 200 117 L172 124 C166 136 152 146 136 148 C110 152 84 150 66 160 Z"/>
    <!-- muzzle shading / mouth -->
    <path fill="#8E5223" d="M150 124 L198 112 C204 118 204 126 196 130 L160 140 C154 136 150 130 150 124 Z"/>
    <path fill="none" stroke="#5A3416" stroke-width="3" stroke-linecap="round" d="M190 118 L170 125"/>
    <!-- grey chin like hers -->
    <path fill="#E7D9CC" opacity="0.85" d="M170 136 L196 130 C198 136 194 142 186 144 L172 146 Z"/>
    <!-- nose -->
    <path fill="#1C1C1E" d="M196 58 C206 54 216 60 217 70 C218 80 210 86 202 84 C194 82 190 74 192 66 Z"/>
    <circle cx="211" cy="66" r="2.6" fill="#FFFFFF" opacity="0.7"/>
    <!-- eye -->
    <ellipse cx="150" cy="98" rx="9" ry="7.5" fill="#1C1C1E" transform="rotate(-18 150 98)"/>
    <circle cx="153" cy="95" r="2.6" fill="#FFFFFF"/>
    <!-- brow -->
    <path fill="none" stroke="#8E5223" stroke-width="4" stroke-linecap="round" d="M136 84 Q150 78 164 84"/>
    <!-- floppy ear with dark tip -->
    <path fill="#9A5A26" d="M96 82 C78 90 66 112 70 140 C72 158 84 170 100 164 C112 158 112 136 108 118 C105 102 104 88 96 82 Z"/>
    <path fill="#5A3416" d="M72 142 C76 160 88 170 100 164 C108 160 110 150 108 140 C96 148 82 150 72 142 Z"/>
  </g>

  <!-- cloud (iCloud) she is looking out of -->
  <path filter="url(#shadow)" fill="url(#cloud)" transform="translate(6 22) scale(0.96)" d="M48 232h156a34 34 0 0 0 6-67.6A50 50 0 0 0 110 150.5 38 38 0 0 0 48 232z"/>

  <!-- AI spark she is watching -->
  <path fill="#FFD60A" d="M224 30c1.6 10.4 6.6 15.4 17 17-10.4 1.6-15.4 6.6-17 17-1.6-10.4-6.6-15.4-17-17 10.4-1.6 15.4-6.6 17-17z"/>
  <path fill="#FFD60A" opacity="0.9" d="M196 18c.9 5.7 3.6 8.4 9.3 9.3-5.7.9-8.4 3.6-9.3 9.3-.9-5.7-3.6-8.4-9.3-9.3 5.7-.9 8.4-3.6 9.3-9.3z"/>

  </g>
  <text x="250" y="112" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">Frieda</text>
  <text x="252" y="160" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#A1A1A6">MCP connector for iCloud · Home Assistant</text>
</svg>
