<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 220" width="1040" height="220" role="img" aria-label="Frieda – MCP connector for iCloud">
  <defs>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
  </defs>
  <g transform="translate(20 10) scale(0.78)">
    <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9955A"/>
      <stop offset="1" stop-color="#A9652E"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B1E5B" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#gloss)"/>
  <g filter="url(#shadow)">
  <g id="dog" transform="translate(-6 -4) scale(0.92)">
    <!-- neck -->
    <path fill="url(#fur)" d="M88 150 L160 150 L172 230 L66 230 Z"/>
    <!-- skull -->
    <ellipse cx="116" cy="118" rx="46" ry="42" fill="url(#fur)" transform="rotate(-18 116 118)"/>
    <!-- muzzle -->
    <path fill="url(#fur)" d="M136 92 L190 70 Q206 64 210 80 L214 106 Q216 122 200 126 L146 140 Z"/>
    <!-- chin / lower lip -->
    <path fill="#8D5224" d="M150 134 L198 122 Q206 134 194 142 L156 150 Z"/>
    <!-- nose -->
    <ellipse cx="206" cy="78" rx="11" ry="10" fill="#1C1C1E" transform="rotate(-18 206 78)"/>
    <!-- eye -->
    <ellipse cx="146" cy="104" rx="8.5" ry="7" fill="#1C1C1E" transform="rotate(-18 146 104)"/>
    <circle cx="148.5" cy="101.5" r="2.4" fill="#FFFFFF"/>
    <!-- floppy ear (dark tip like hers) -->
    <path fill="#8D5224" d="M74 96 Q60 120 70 156 Q78 176 96 168 Q106 150 100 124 Q96 100 74 96 Z"/>
    <path fill="#5A3416" d="M70 150 Q76 172 96 168 Q102 160 98 148 Q84 156 70 150 Z"/>
    <!-- brow -->
    <path fill="none" stroke="#8D5224" stroke-width="4" stroke-linecap="round" d="M130 90 Q144 84 158 88"/>
  </g>
  </g>
  <path filter="url(#shadow)" fill="url(#cloud)" d="M52 232h152a34 34 0 0 0 6-67.6A50 50 0 0 0 112 150.5 38 38 0 0 0 52 232z"/>
  <path fill="#FFD60A" d="M214 40c1.6 10.4 6.6 15.4 17 17-10.4 1.6-15.4 6.6-17 17-1.6-10.4-6.6-15.4-17-17 10.4-1.6 15.4-6.6 17-17z"/>
  <path fill="#FFD60A" opacity="0.9" d="M190 28c.9 5.7 3.6 8.4 9.3 9.3-5.7.9-8.4 3.6-9.3 9.3-.9-5.7-3.6-8.4-9.3-9.3 5.7-.9 8.4-3.6 9.3-9.3z"/>

  </g>
  <text x="250" y="112" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="url(#text)" letter-spacing="-1.5">Frieda</text>
  <text x="252" y="160" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#6E6E73">MCP connector for iCloud · Home Assistant</text>
</svg>
