name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (lint, format, security rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements/lint.txt
      - run: ruff check custom_components tests tools/preview
      - run: ruff format --check custom_components tests tools/preview

  tests:
    name: pytest against Home Assistant ${{ matrix.ha }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ha == 'next' }}
    strategy:
      fail-fast: false
      matrix:
        # the release requirements_dev.txt follows, the oldest one hacs.json allows, and the newest one (an early
        # warning: Dependabot moves it on, betas included; it may fail without blocking)
        include:
          - ha: "2026.10.3"
            lock: requirements/test.txt
          - ha: minimum
            lock: requirements/ha-minimum/test.txt
          - ha: next
            lock: requirements/ha-next/test.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      # uv installs the hash-pinned lock in seconds (pip needed about a minute for Home Assistant)
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.lock }}
      - run: uv pip install --system --require-hashes -r ${{ matrix.lock }}
      - name: The minimum is the one hacs.json allows
        if: matrix.ha == 'minimum'
        run: python -c "import json, homeassistant.const as c; m = json.load(open('hacs.json'))['homeassistant']; assert c.__version__ == m, (c.__version__, m)"
      - run: pytest -q --timeout=120

  manifest:
    name: Manifest requirements install cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements/manifest.txt
      - run: pip check
      - run: python scripts/check_manifest_requirements.py

  icons:
    name: Icon assets match the SVG sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements/icons.txt
      - run: python scripts/build_icons.py --check --only icons

  types:
    # pyright (basedpyright) with the integration's requirements: new type errors fail; the ones found when the check
    # came are in .basedpyright/baseline.json
    name: Types (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements/test.txt
      - run: uv pip install --system --require-hashes -r requirements/test.txt -r requirements/types.txt
      - run: basedpyright
