name: Release assets

# Builds the HACS zip from the tagged source, attaches a CycloneDX SBOM of the
# runtime requirements and signs both with GitHub's build provenance attestation.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build assets for
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build, SBOM and attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Check that manifest version matches the tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION=$(python -c "import json; print(json.load(open('custom_components/friedafetch/manifest.json'))['version'])")
          echo "tag=$TAG manifest=$VERSION"
          test "v$VERSION" = "$TAG"

      - name: Build HACS zip
        run: |
          cd custom_components/friedafetch
          find . -name "__pycache__" -prune -exec rm -rf {} +
          zip -r -X ../../friedafetch.zip . -x "*.pyc"
          cd ../..
          sha256sum friedafetch.zip | tee friedafetch.zip.sha256

      - name: SBOM of the runtime requirements (CycloneDX)
        run: |
          python -m venv sbom-venv
          sbom-venv/bin/pip install -q --require-hashes -r requirements/sbom.txt
          sbom-venv/bin/cyclonedx-py environment sbom-venv --of JSON -o sbom.cdx.json --mc-type library
          python -c "import json; d=json.load(open('sbom.cdx.json')); print(len(d.get('components', [])), 'components')"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            friedafetch.zip
            sbom.cdx.json

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # the Sigstore bundle of the attestation goes along, so the signature can be checked offline
        # (cosign verify-blob-attestation / gh attestation verify --bundle) and is visible to OpenSSF Scorecard
        run: |
          cp "$BUNDLE" friedafetch.zip.sigstore.json
          # the SLSA provenance itself (the DSSE envelope of the bundle), in the usual *.intoto.jsonl form
          python3 -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1]))['dsseEnvelope']))" "$BUNDLE" > friedafetch.zip.intoto.jsonl
          gh release upload "$TAG" friedafetch.zip friedafetch.zip.sha256 friedafetch.zip.sigstore.json friedafetch.zip.intoto.jsonl sbom.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
