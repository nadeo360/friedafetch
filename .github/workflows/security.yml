name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (runtime requirements)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Collect runtime requirements from the manifest
        run: |
          python -c "import json; print('\n'.join(json.load(open('custom_components/icloud_mcp/manifest.json'))['requirements']))" > requirements_manifest.txt
          cat requirements_manifest.txt
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements_manifest.txt

  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install bandit
      - run: bandit -q -r custom_components -c pyproject.toml
