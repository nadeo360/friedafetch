name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (runtime requirements)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Collect runtime requirements from the manifest
        run: |
          python -c "import json; print('\n'.join(json.load(open('custom_components/icloud_mcp/manifest.json'))['requirements']))" > requirements_manifest.txt
          cat requirements_manifest.txt
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements_manifest.txt
          # CVE-2026-59951 concerns stateful Streamable-HTTP sessions in mcp < 1.30. Home Assistant 2026.10 ships
          # mcp 1.28.1 and our endpoint runs the server with stateless=True and no session manager, so it is not
          # affected. Remove once Home Assistant bumps mcp.
          ignore-vulns: |
            CVE-2026-59951

  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: pip install bandit
      - run: bandit -q -r custom_components -c pyproject.toml
