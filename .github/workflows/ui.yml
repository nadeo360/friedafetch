name: Panels in the browser

# Both panels with the example data of the dev preview, in Chromium and WebKit (the engine of Safari and of the Home
# Assistant app on iPhone and iPad), on desktop and phone sizes: every scenario must load without script errors,
# missing icons or horizontal overflow, and the regression tests of tools/preview/tests must pass.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # the Frieda Postfach panel shown next to Frieda's (its released state)
  POSTFACH_REF: main

jobs:
  browser:
    name: Chromium and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out Frieda Postfach
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nadeo360/friedafetch-mail
          ref: ${{ env.POSTFACH_REF }}
          path: postfach
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/ui.txt
      - run: pip install --require-hashes -r requirements/ui.txt
      - run: python -m playwright install --with-deps chromium webkit
      - name: Browser tests
        working-directory: tools/preview
        env:
          POSTFACH_DIR: ${{ github.workspace }}/postfach
        run: python -m pytest -q --browser chromium --browser webkit --tracing retain-on-failure --output "$RUNNER_TEMP/traces"
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: ${{ runner.temp }}/traces
          retention-days: 14
