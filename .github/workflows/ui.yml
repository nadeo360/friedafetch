name: Panels in the browser

# Both panels with the example data of the dev preview, in Chromium and WebKit (the engine of Safari and of the Home
# Assistant app on iPhone and iPad), on desktop and phone sizes: every scenario must load without script errors,
# missing icons or horizontal overflow, and the regression tests of tools/preview/tests must pass.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # the Frieda Postfach panel shown next to Frieda's (its released state)
  POSTFACH_REF: main

jobs:
  browser:
    # one job per engine, side by side; within a job the tests run in parallel (pytest-xdist)
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            name: Chromium
          - browser: webkit
            name: WebKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out Frieda Postfach
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nadeo360/friedafetch-mail
          ref: ${{ env.POSTFACH_REF }}
          path: postfach
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements/ui.txt
      - run: uv pip install --system --require-hashes -r requirements/ui.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        working-directory: tools/preview
        env:
          POSTFACH_DIR: ${{ github.workspace }}/postfach
        run: python -m pytest -q -n auto --browser ${{ matrix.browser }} --tracing retain-on-failure --output "$RUNNER_TEMP/traces"
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: ${{ runner.temp }}/traces
          retention-days: 14
