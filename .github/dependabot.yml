version: 2
updates:
  # Python pins in requirements_dev.txt follow the Home Assistant release and are bumped together with it;
  # Dependabot only opens security updates for them.
  - package-ecosystem: pip
    directories: ["/", "/requirements"]  # requirements/*.txt are the hash-pinned CI locks (scripts/lock_requirements.sh)
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies]
  # the newest Home Assistant for the CI matrix: a pull request (with its test run) for every new release and beta
  - package-ecosystem: pip
    directory: "/requirements/ha-next"
    schedule:
      interval: weekly
    allow:
      - dependency-name: pytest-homeassistant-custom-component
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies]
