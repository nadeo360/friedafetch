version: 2
updates:
  # Python pins in requirements_dev.txt follow the Home Assistant release and are bumped together with it;
  # Dependabot only opens security updates for them.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies]
