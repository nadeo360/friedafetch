[project]
name = "friedafetch"
version = "0.1.0"
description = "Frieda – MCP connector for iCloud: calendars, contacts, mail and notes for Home Assistant"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".venv", ".venv314"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".venv", ".venv314"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"tools/preview/tests/*" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".venv314"]
# B314/B405/B406: XML from Apple's authenticated TLS endpoints is parsed with the stdlib (defusedxml is
# not available inside Home Assistant; expat protects against entity expansion). B406 flags xml.sax.saxutils.escape,
# which only escapes text.
skips = ["B101", "B314", "B405", "B406"]

[tool.basedpyright]
# type check of the integration (CI): pyright's standard rules
include = ["custom_components/friedafetch"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingModuleSource = false
# Home Assistant re-exports its helpers (websocket_api, http) without __all__; importing them from there is its own convention
reportPrivateImportUsage = false
# entities override Home Assistant's cached properties with @property (as Home Assistant's own integrations do)
reportIncompatibleVariableOverride = false
reportIncompatibleMethodOverride = false
# what was found when the check came (narrowing that pyright cannot follow, gaps in library type hints) is in
# .basedpyright/baseline.json; CI fails on every new finding, and the baseline only shrinks
baselineFile = ".basedpyright/baseline.json"
