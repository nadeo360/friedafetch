[project]
name = "ha-icloud-mcp"
version = "0.1.0"
description = "Home Assistant integration exposing iCloud calendars, contacts, mail and notes as MCP tools"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".venv", ".venv314"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".venv", ".venv314"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]
