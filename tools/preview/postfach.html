<!doctype html><html lang="de"><head><title>Frieda Dev-Vorschau</title><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
  :root { --primary-color:#D97757; --accent-color:#D97757; --primary-text-color:#141413; --secondary-text-color:#73726C; --primary-background-color:#FAF9F5; --secondary-background-color:#F0EEE6; --card-background-color:#FFFFFF; --divider-color:rgba(20,20,19,.07); --error-color:#C15F3C; --warning-color:#D4A27F; --success-color:#788C5D; --text-primary-color:#FFFFFF; --app-header-background-color:#FAF9F5; --app-header-text-color:#141413; --ha-card-border-radius:22px; --ha-card-box-shadow:0 1px 2px rgba(20,20,19,.04),0 6px 20px rgba(20,20,19,.05); --ha-card-border-width:0px; }
  :root.dark { --primary-text-color:#E8E6DE; --secondary-text-color:#A3A199; --primary-background-color:#1F1E1C; --secondary-background-color:#2A2926; --card-background-color:#262624; --divider-color:rgba(255,255,255,.08); --app-header-background-color:#1F1E1C; --app-header-text-color:#E8E6DE; }
  body { margin:0; font-family: Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--primary-background-color); }
</style></head><body>
<script>window.__errs=[];window.addEventListener("error",e=>{window.__errs.push(String(e.message));document.body&&document.body.setAttribute("data-err",window.__errs.join(" | "))});window.addEventListener("unhandledrejection",e=>{window.__errs.push(String(e.reason&&e.reason.stack||e.reason));document.body.setAttribute("data-err",window.__errs.join(" | "))});</script>
<script type="module">
import * as mdi from "https://cdn.jsdelivr.net/npm/@mdi/js@7.4.47/+esm";
const q = new URLSearchParams(location.search);
if (q.get("dark")) document.documentElement.classList.add("dark");
customElements.define("ha-icon", class extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  connectedCallback() { this.draw(); }
  attributeChangedCallback() { this.draw(); }
  draw() {
    const name = (this.getAttribute("icon") || "").replace("mdi:", "");
    const key = "mdi" + name.split("-").map((p) => p[0].toUpperCase() + p.slice(1)).join("");
    const path = mdi[key];
    if (!path) console.error("missing icon", name);
    this.style.cssText += "display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)";
    this.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="${path || ""}"/></svg>`;
  }
});
customElements.define("ha-menu-button", class extends HTMLElement {});
const now = new Date();
const iso = (minAgo) => new Date(now - minAgo * 60000).toISOString();
const rule = (id, name, conds, actions, hits) => ({ id, name, conditions: conds, actions: { move_to: null, mark_seen: null, flag: null, delete: false, stop: true, save_attachments: false, ...actions }, match: "any", enabled: true, mailbox: "INBOX", hits });
const data = {
  "friedafetch_mail/accounts": { accounts: [{ entry_id: "e1", label: "privat", apple_id: "erika@example.com", title: "erika@example.com", mail_enabled: true, read_only: false, allow_delete: true, rules_auto: true, rules_interval: 5, rules_push: true, rules_total: 3, rules_enabled: 3, hits: 25, automation: { enabled: true, interval: 5, enabled_rules: 3, push: { state: "listening" } }, attachments: true }] },
  "friedafetch_mail/rules/list": { rules: [
    rule("r1", "Werbung & Newsletter löschen", [{ field: "from", op: "domain", value: "werbung.example" }, { field: "from", op: "domain", value: "drogerie.example" }], { delete: true }, 2),
    rule("r2", "Spam/Phishing nach Junk", [{ field: "from", op: "domain", value: "spam.example" }], { move_to: "Junk", mark_seen: true }, 1),
    rule("r3", "CI-Meldungen löschen", [{ field: "subject", op: "regex", value: "Run failed|\\] Bump " }], { delete: true }, 20),
    { ...rule("r4", "Belege ins Archiv", [{ field: "subject", op: "contains", value: "Rechnung" }, { field: "subject", op: "contains", value: "Quittung" }, { field: "subject", op: "contains", value: "Zahlungsbeleg" }], { move_to: "Archive", save_attachments: true }, 3), enabled: false },
  ], last_run: { trigger: "auto", finished: iso(2), checked: 0, matched: 0 }, automation: { enabled: true, interval: 5, enabled_rules: 3, push: { state: "listening" } } },
  "friedafetch_mail/mailboxes": { mailboxes: ["INBOX", "Archive", "Junk", "Company"] },
  "friedafetch_mail/rules/history": { runs: [], total: 0 }, // built by mock-postfach.js from the example mails
  "friedafetch_mail/ai": { status: { enabled: true, active: true, entity: "ai_task.mein_ki_modell", entity_ok: true, mode: "act", limit: 30, used_this_hour: 0, notify: 0 }, categories: [{ id: "c1", name: "Persönlich & wichtig", description: "Mails von echten Menschen", move_to: null, mark_seen: false, flag: false }, { id: "c2", name: "Rechnungen & Belege", description: "Rechnungen", move_to: null, mark_seen: false, flag: false }, { id: "c3", name: "Newsletter & Werbung", description: "Werbung", move_to: "Deleted Messages", mark_seen: false, flag: false }], ratings: [], examples: 0, usage: null }, // ratings and the AI log: mock-postfach.js

};
const mock = (await import("./mock-postfach.js?v=__BUILD__")).install({ data, q });
const el = document.createElement("friedafetch-mail-panel");
document.body.appendChild(el);
el.narrow = innerWidth < 870; el.panel = {};
const userData = {};
window.__userData = userData;
if (q.get("tab")) userData.friedafetch_mail_panel = { opts: { tabs: { current: q.get("tab") } } }; // the tab to start with
// two AI entities, so the accuracy check offers a choice (example names)
const states = { "ai_task.mein_ki_modell": { entity_id: "ai_task.mein_ki_modell", state: "unknown", attributes: { friendly_name: "Mein KI-Modell" } }, "ai_task.lokales_modell": { entity_id: "ai_task.lokales_modell", state: "unknown", attributes: { friendly_name: "Lokales Modell" } } };
el.hass = { language: "de", locale: { language: "de" }, states, connection: { subscribeMessage: async (cb, m) => { window.__live = window.__live || {}; window.__live[m.type] = cb; return () => { delete window.__live[m.type]; }; } }, callWS: async (m) => {
  if (m.type === "frontend/get_user_data") return { value: userData[m.key] ?? null };
  if (m.type === "frontend/set_user_data") { userData[m.key] = structuredClone(m.value); return null; }
  const answer = await mock(m);
  if (answer !== undefined) return answer;
  return structuredClone(data[m.type] || {});
} };
if (q.get("pending")) data["friedafetch_mail/rules/history"].current = { trigger: "push", started: new Date(Date.now() - 4000).toISOString(), ai: true };
if (q.get("update")) { q.set("v", "dev-alt"); q.set("server", "dev-neu"); }
if (q.get("server")) data["friedafetch_mail/accounts"].version = q.get("server");
await import(`./postfach/panel.js?v=${q.get("v") || "__BUILD__"}`); // a new key per build, so no browser keeps old panel files
await new Promise((r) => setTimeout(r, 700));
const root = el.shadowRoot;
const scene = q.get("scene");
const wait = (ms = 250) => new Promise((r) => setTimeout(r, ms));
const click = async (sel, ms) => { root.querySelector(sel)?.click(); await wait(ms); };
// rules (tab=rules)
if (scene === "menu") { root.querySelector("#run-menu").open = true; }
if (scene === "rule") await click('button[data-action="expand"][data-id="r1"]');
if (scene === "rowmenu") { root.querySelector('tr[data-rule-id="r2"] details.rowmenu').open = true; }
if (scene === "edit") await click('tr[data-rule-id="r2"] .menu-list [data-action="edit"]');
// AI sorting and its log (tab=ai, tab=aiu)
if (scene === "catedit") await click('[data-action="ai-cat-edit"][data-index="2"]', 300);
if (scene === "confirm") await click('[data-action="aiu-clear"]');
if (scene === "aiopen") await click('button[data-action="aiu-open"][data-i="1"]');
if (scene === "charts") { await click('section[data-widget="aiu"] details.cardmenu summary', 50); await click('[data-action="aiu-charts"]'); }
if (scene === "tlheld") await click('[data-action="aiu-mail"]', 400);
// activity
if (scene === "runs" || scene === "history") await click('[data-action="act-runs"]');
if (scene === "unsure") await click('[data-action="act-view"][data-v="unsure"]', 400);
if (scene === "check") await click('[data-action="ai-check"]', Number(q.get("aislow") || 1500) + 300);
if (scene === "cols") { await click('[data-action="act-runs"]'); root.querySelector('section[data-widget="history"] details.colmenu').open = true; }
if (scene === "pick" || scene === "rerating") {
  await click('[data-action="act-pick"]');
  const day = root.querySelector('.daypicks [data-action="act-day"]') || root.querySelector('li.day [data-action="act-day"]');
  if (day) { if (day.tagName === "INPUT") { day.checked = true; day.dispatchEvent(new Event("change")); } else day.click(); await wait(300); }
  else for (const b of [...root.querySelectorAll('[data-action="act-open"][role="checkbox"]')].slice(0, 3)) { b.click(); await wait(80); }
  if (scene === "rerating") { await click('.actbar [data-action="act-rerate"]', 300); await click('[data-action="confirm-yes"]', 400); }
}
if (scene === "loc" || scene === "gone") {
  const i = scene === "loc" ? 5 : 7;
  const key = window.__rows[i]?.key;
  const b = [...root.querySelectorAll('[data-action="act-open"]')].find((x) => x.dataset.id === key);
  b?.click(); await wait(1200);
}
if (scene === "assist" || scene === "assistcard") {
  await click('[data-action="assist-open"]', 200);
  await click('[data-action="assist-chip"]', 1300);
  if (scene === "assistcard") await click('[data-action="assist-view"][data-v="card"]');
}
if (scene === "link") {
  // a link from Frieda's change log opens the timeline of that mail
  history.replaceState(null, "", `?mail=${encodeURIComponent("<gartenmarkt-rabatt@example>")}&account=e1`);
  el._openLinked(); await wait(600);
}
document.title = "ready";
</script></body></html>
